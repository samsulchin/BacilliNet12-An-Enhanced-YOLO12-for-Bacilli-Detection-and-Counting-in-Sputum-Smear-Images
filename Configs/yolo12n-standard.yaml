# Standard YOLO12n configuration used as the baseline (Scenarios S1-S6)
# No SPD-Conv, no P2 head. Detection at three scales: P3/8, P4/16, P5/32.
# Original file name in the experiments: yolov12-standar.yaml

nc: 1  # number of classes (bacilli)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0  P1/2  strided convolution
  - [-1, 1, Conv, [128, 3, 2]]     # 1  P2/4  strided convolution
  - [-1, 2, C3k2, [128, True]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3  P3/8
  - [-1, 2, C3k2, [256, True]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5  P4/16
  - [-1, 2, A2C2f, [512, True]]    # 6  area attention
  - [-1, 1, Conv, [1024, 3, 2]]    # 7  P5/32
  - [-1, 2, A2C2f, [1024, True]]   # 8  area attention

head:
  # Top-down pathway (FPN)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 9
  - [[-1, 6], 1, Concat, [1]]                   # 10 concat with backbone P4
  - [-1, 2, A2C2f, [512]]                       # 11
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 12
  - [[-1, 4], 1, Concat, [1]]                   # 13 concat with backbone P3
  - [-1, 2, A2C2f, [256]]                       # 14 P3/8 output

  # Bottom-up pathway (PAN)
  - [-1, 1, Conv, [256, 3, 2]]                  # 15
  - [[-1, 11], 1, Concat, [1]]                  # 16
  - [-1, 2, A2C2f, [512]]                       # 17 P4/16 output
  - [-1, 1, Conv, [512, 3, 2]]                  # 18
  - [[-1, 8], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [1024, True]]                 # 20 P5/32 output

  - [[14, 17, 20], 1, Detect, [nc]]             # 21 Detect(P3, P4, P5)
